name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # 1. Run Google's Release Please action to manage versions & changelogs
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: simple

      # 2. Checkout the repository (only if a release was actually created by merging the Release PR)
      - name: Checkout Code
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v4

      # 3. Setup Go compiler environment
      - name: Set up Go
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      # 4. Compile the statically linked Linux AMD64 production binary
      - name: Build Statically Linked Binary
        if: ${{ steps.release.outputs.release_created }}
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o proxmox-api main.go

      # 5. Upload the compiled binary as a release asset using GitHub CLI (gh)
      - name: Upload Release Asset
        if: ${{ steps.release.outputs.release_created }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ steps.release.outputs.tag_name }} proxmox-api
